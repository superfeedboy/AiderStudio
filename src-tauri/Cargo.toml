[package]
name = "aider-studio"
version = "0.1.0"
description = "IDE desktop pair-programming IA & Multi-Agents (Vue 3 + Tauri v2 + Rust)"
authors = ["vAIx STUDIO"]
edition = "2021"

[lib]
name = "aider_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
dirs = "7"
regex = "1"
